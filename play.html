<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>웹에서 플레이</title>
<link rel="icon" href="data:," />
<!-- 웹 플레이 페이지(첫 화면 게임기의 START 버튼이 여는 곳). 주소: play.html?g=<Games 아래 폴더 이름>
     유니티 WebGL(Web) 빌드를 Games/<폴더>/ 에 넣으면 됩니다 → Games/<폴더>/Build/<폴더>.loader.js · .data · .framework.js · .wasm
     (빌드 폴더 이름 = 파일 이름. Compression Format = Disabled 권장. Decompression Fallback을 켠 .unityweb 빌드도 읽습니다)
     play.json 에서 이 주소를 가리키는 프로젝트를 찾아 제목·태그를 data/projects/<id>.json에서 읽어 옵니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" />
<style>
:root{
  color-scheme:dark;
  --room:#16131c; --room2:#221d2b; --shell:#e7e2d6; --shell2:#cfc8b8; --ink:#2a2530;
  --scrHi:#ffe27a; --ok:#46d39a; --dim:#a99cbc;
  --ui:"Pretendard",system-ui,sans-serif; --px:"Galmuri11","Galmuri9",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% 20%,var(--room2),var(--room));color:#eee8f5;font:15px/1.6 var(--ui);display:flex;flex-direction:column;min-height:100%}
button,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--scrHi);outline-offset:3px}

.top{display:flex;align-items:center;gap:12px;padding:12px max(16px,2.4vw);flex-wrap:wrap}
.top .back{font-family:var(--px);font-size:13px;text-decoration:none;color:#cfc6dc;border:1px solid #ffffff30;padding:7px 12px;border-radius:6px}
.top .back:hover{border-color:var(--scrHi);color:var(--scrHi)}
.top h1{font-family:"Galmuri14",var(--px);font-weight:400;font-size:clamp(18px,1.8vw,26px);margin-right:auto}
.top h1 small{font-family:var(--px);font-size:11px;color:var(--dim);letter-spacing:2px;margin-left:10px}
.tbtn{font-family:var(--px);font-size:13px;background:#ffffff14;border:1px solid #ffffff30;padding:7px 12px;border-radius:6px;cursor:pointer}
.tbtn:hover{border-color:var(--scrHi);color:var(--scrHi)}
.tbtn.go{background:#1f9e64;border-color:#136140;color:#fff}
select.tbtn{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,#cfc6dc 50%),linear-gradient(135deg,#cfc6dc 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select.tbtn option{background:#221d2b}

.stageArea{flex:none;display:grid;place-items:center;padding:6px max(16px,2.4vw) 16px}
.frame{background:linear-gradient(180deg,var(--shell),var(--shell2));border-radius:22px 22px 36px 36px;padding:16px 18px 14px;box-shadow:inset 0 3px 0 #fff8,inset 0 -6px 0 #0002,0 30px 60px #000a}
.frame .brand{display:flex;justify-content:space-between;font-family:var(--px);font-size:11px;letter-spacing:2px;color:#8f8676;margin:0 4px 8px}
.led{display:flex;align-items:center;gap:6px}.led i{width:8px;height:8px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}
.bezel{background:#3b3542;border-radius:10px 10px 24px 10px;padding:10px}
#unity-container{position:relative;background:#000;overflow:hidden;border-radius:3px}
#unity-canvas{display:block;width:100%;height:100%;background:#000}
.load{position:absolute;inset:0;display:grid;place-items:center;background:#0f1a17;text-align:center;font-family:var(--px);color:#c8f2d8;padding:20px}
.load b{display:block;font-family:"Galmuri14",var(--px);font-weight:400;font-size:clamp(20px,2.6vw,34px);color:#fff}
.load .bar{width:min(360px,70vw);height:12px;border:2px solid #c8f2d8;margin:16px auto 8px;padding:2px}
.load .bar i{display:block;height:100%;width:0;background:var(--scrHi);transition:width .2s}
.load p{font-size:12px;color:#6f9c84}
.load.err b{color:#ff8a8a}
.load a,.load code{color:var(--scrHi)}
.hint{font-family:var(--px);font-size:11px;color:#6b6358;text-align:center;margin-top:8px}

.notes{padding:0 max(16px,2.4vw) 28px;display:flex;justify-content:center}
.notes>div{width:min(1100px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:8px;padding:14px 16px;min-width:0}
.card h2{font-family:var(--px);font-size:13px;color:var(--scrHi);font-weight:400;margin-bottom:6px;letter-spacing:1px}
.card p,.card li{font-size:14px;color:#d8d0e4}
.card ul{list-style:none;display:grid;gap:4px}
.card li::before{content:"▸ ";color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{font-family:var(--px);font-size:11px;border:1px solid #ffffff40;padding:1px 7px;border-radius:3px}
.mobile-warn{display:none;margin:0 max(16px,2.4vw) 10px;padding:10px 14px;border-radius:8px;background:#ffb34722;border:1px solid #ffb34766;font-size:14px}
.mobile-warn.on{display:block}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="index.html">◀ 게임 선반으로</a>
  <h1 id="title">웹에서 플레이<small>SY-01 · WEB PLAY</small></h1>
  <select class="tbtn" id="size" aria-label="화면 크기">
    <option value="fit">창에 맞춤 (16:9)</option>
    <option value="1280">1280 × 720</option>
    <option value="960">960 × 540</option>
  </select>
  <button class="tbtn go" id="fs">⛶ 전체화면</button>
</header>
<div class="mobile-warn" id="mwarn">휴대폰에서는 조작이 어렵거나 느릴 수 있어요. PC 브라우저(크롬·엣지)를 권장합니다.</div>

<main class="stageArea" id="stageArea">
  <div class="frame" id="frame">
    <div class="brand"><span>SY-01 PORTFOLIO SYSTEM</span><span class="led"><i></i>PLAYING</span></div>
    <div class="bezel">
      <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div class="load" id="load"><div><b id="loadTitle">NOW LOADING</b><div class="bar"><i id="bar"></i></div><p id="loadMsg">게임 파일을 받는 중… 처음 한 번은 조금 걸려요</p></div></div>
      </div>
    </div>
    <div class="hint">게임 화면을 한 번 클릭하면 키보드 입력이 들어갑니다</div>
  </div>
</main>

<section class="notes"><div id="notes"></div></section>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const g=(new URLSearchParams(location.search).get('g')||'').replace(/[^\w\-.]/g,'');
  const ASPECT=16/9;
  // 게임 내부 해상도: 화면에 보이는 크기와 상관없이 세로 RENDER_H 픽셀로 그림(에디터의 1920×1080과 같게). ?h=720 처럼 바꿀 수 있음
  const RENDER_H=Math.max(360,Math.min(2160,parseInt(new URLSearchParams(location.search).get('h'))||1080));
  const dprFor=()=>RENDER_H/Math.max(1,document.fullscreenElement?screen.height:box.clientHeight);
  const canvas=$('#unity-canvas'), box=$('#unity-container'), area=$('#stageArea'), sizeSel=$('#size');
  let instance=null;

  // 16:9 크기 맞추기 (고른 크기가 창보다 크면 창에 맞게 줄임)
  function layout(){
    const cs=getComputedStyle(area);
    const availW=area.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-56;
    const availH=Math.max(240,window.innerHeight-area.getBoundingClientRect().top-160);
    let w=Math.min(availW,availH*ASPECT);
    if(sizeSel.value!=='fit')w=Math.min(w,+sizeSel.value);
    w=Math.max(280,Math.floor(w));
    box.style.width=w+'px'; box.style.height=Math.round(w/ASPECT)+'px';
    if(instance&&instance.Module)instance.Module.devicePixelRatio=dprFor();
  }
  sizeSel.onchange=layout; addEventListener('resize',layout); layout();
  document.addEventListener('fullscreenchange',()=>{if(instance&&instance.Module)instance.Module.devicePixelRatio=dprFor()});
  $('#fs').onclick=()=>{ if(instance) instance.SetFullscreen(1); else if(box.requestFullscreen) box.requestFullscreen().catch(()=>{}); };
  if(/iPhone|iPad|Android/i.test(navigator.userAgent)) $('#mwarn').classList.add('on');

  function fail(title,msg){const l=$('#load');l.classList.add('err');l.style.display='';$('#loadTitle').textContent=title;$('#loadMsg').innerHTML=msg;$('.bar').style.display='none'}

  // 프로젝트 정보(제목·태그) — play.json에서 이 게임을 가리키는 프로젝트를 찾음
  async function info(){
    try{
      const play=await (await fetch('play.json',{cache:'no-cache'})).json();
      const id=Object.keys(play).find(k=>new RegExp('[?&]g='+g.replace(/[.\-]/g,'\\$&')+'(&|$)').test(play[k]||''));
      if(!id)return;
      const d=await (await fetch(`data/projects/${encodeURIComponent(id)}.json`,{cache:'no-cache'})).json();
      document.title=`${d.title} · 웹에서 플레이`;
      $('#title').innerHTML=`${esc(d.title)}<small>SY-01 · WEB PLAY</small>`;
      const meta={};(d.meta||[]).forEach(m=>meta[m.label]=m.value);
      $('#notes').innerHTML=`
        <div class="card"><h2>GAME</h2><p>${esc(d.tagline)}</p><div class="chips">${(d.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div></div>
        <div class="card"><h2>INFO</h2><ul>${meta['장르']?`<li>${esc(meta['장르'])}</li>`:''}${meta['기간']?`<li>${esc(meta['기간'])}</li>`:''}${meta['인원']?`<li>${esc(meta['인원'])}</li>`:''}</ul></div>
        <div class="card"><h2>MORE</h2><ul><li><a href="doc.html?p=${encodeURIComponent(id)}">상세 프로젝트 문서</a></li><li><a href="project.html?p=${encodeURIComponent(id)}">슬라이드</a></li>${d.links?.video?`<li><a href="${esc(d.links.video)}" target="_blank" rel="noopener">플레이 영상 ↗</a></li>`:''}</ul></div>`;
    }catch(e){}
  }
  info();

  // 유니티 WebGL 빌드 읽기: Games/<g>/Build/<g>.*
  async function exists(u){try{const r=await fetch(u,{method:'HEAD',cache:'no-cache'});return r.ok}catch(e){return false}}
  async function start(){
    if(!g){fail('NO GAME','주소에 ?g=게임폴더 가 없어요. <a href="index.html">게임 선반으로</a>');return}
    const base=`Games/${encodeURIComponent(g)}/Build/${encodeURIComponent(g)}`;
    if(!await exists(base+'.loader.js')){fail('BUILD NOT FOUND',`Games/${esc(g)}/Build/ 에 빌드 파일이 없어요.<br>유니티 Web 빌드 폴더 이름이 <code>${esc(g)}</code>인지 확인해 주세요.`);return}
    let ext='';for(const e of ['','.unityweb','.br','.gz']){if(await exists(base+'.data'+e)){ext=e;break}}
    const s=document.createElement('script'); s.src=base+'.loader.js';
    s.onload=()=>{
      createUnityInstance(canvas,{
        dataUrl:base+'.data'+ext, frameworkUrl:base+'.framework.js'+ext, codeUrl:base+'.wasm'+ext,
        streamingAssetsUrl:`Games/${encodeURIComponent(g)}/StreamingAssets`,
        companyName:'SY-01', productName:g, productVersion:'1.0', devicePixelRatio:dprFor(),
        showBanner:(msg,type)=>{if(type==='error')fail('ERROR',esc(msg))}
      },p=>{$('#bar').style.width=Math.round(p*100)+'%'}).then(inst=>{
        instance=inst; $('#load').style.display='none'; canvas.focus();
      }).catch(err=>fail('LOAD ERROR',esc(err)+(ext==='.br'||ext==='.gz'?'<br>GitHub Pages에서는 Compression Format을 <code>Disabled</code>로 다시 빌드해 주세요.':'')));
    };
    s.onerror=()=>fail('LOAD ERROR','loader.js를 읽지 못했어요.');
    document.body.appendChild(s);
  }
  start();
})();
</script>
</body>
</html>
